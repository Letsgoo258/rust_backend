[package]
name = "eravaya"
default-run = "eravaya"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "util"] }
argon2 = "0.5"
axum-login = "0.15"
tower-sessions = "0.12"
tower-sessions-sqlx-store = { version = "0.13", features = ["postgres"] }
thiserror = "1.0"
reqwest = { version = "0.13", features = ["json", "blocking", "default-tls"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
async-trait = "0.1.92"
tracing-appender = "0.2.5"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["http-proto", "reqwest-client", "reqwest-rustls"] }
tracing-opentelemetry = "0.33.0"
tower_governor = "0.3.2"
csv = "1.3"
base64 = "0.22"
sysinfo = "0.39.6"
dashmap = "6.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde_urlencoded = "0.7"
anyhow = "1.0"
rand = "0.8"
aes-gcm = "0.10"
bytes = "1.0"
wacore = { version = "0.7.0", default-features = false }
wacore-appstate = { version = "0.7.0", default-features = false }
whatsapp-rust = { version = "0.7", default-features = false, features = ["tokio-runtime", "tokio-transport", "ureq-client"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "eravaya"
path = "src/main.rs"

[[bin]]
name = "test_runner"
path = "src/bin/test_runner.rs"
