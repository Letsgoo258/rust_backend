
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eravaya-backend
    restart: unless-stopped
    ports:
      - "8089:8089"
    env_file:
      - .env
    environment:
      - APP_PORT=8089
      - ALERT_ADMIN_EMAIL=kabhiram67@gmail.com
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
